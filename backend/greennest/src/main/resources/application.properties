spring.application.name=greennest

# ================================
# SERVER CONFIGURATION
# ================================
server.port=8080

# ================================
# DATABASE CONFIGURATION  
# ================================
spring.datasource.url=jdbc:mysql://localhost:3306/greennest_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=manager
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA/HIBERNATE CONFIGURATION
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================================
# JWT SECURITY CONFIGURATION
# ================================
jwt.secret=ThisIsAVeryLongSecretKeyForJWTTokenThatShouldBeAtLeast32Characters
jwt.expiration=86400000

# ================================
# LOGGING CONFIGURATION
# ================================
logging.level.com.greennest.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ================================
# RAZORPAY CONFIGURATION
